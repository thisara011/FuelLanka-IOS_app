<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Open FuelSmart LK</title>
  </head>
  <body>
    <main>
      <h1>Continue in FuelSmart LK</h1>
      <p id="status">Opening the FuelSmart LK app…</p>
      <p><a id="open-app" href="fuellanka://finishSignUp">Open FuelSmart LK</a></p>
    </main>
    <script>
      const callback = `fuellanka://finishSignUp${window.location.search}${window.location.hash}`;
      document.getElementById("open-app").href = callback;
      window.location.replace(callback);
      window.setTimeout(() => {
        document.getElementById("status").textContent = "Tap Open FuelSmart LK to finish signing in.";
      }, 1200);
    </script>
  </body>
</html>
